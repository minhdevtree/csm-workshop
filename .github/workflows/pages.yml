# Đưa slide lên GitHub Pages, để có một link chia sẻ được sau buổi nói.
# Bật một lần tại Settings > Pages > Source: GitHub Actions.
name: Publish slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Chỉ đẩy phần cần cho trình chiếu. Slide tham chiếu ../assets nên
      # thư mục assets phải đi cùng, và index.html phải nằm ở gốc site.
      - name: Gom site
        run: |
          mkdir -p site/slides
          cp slides/index.html site/slides/index.html
          cp -r assets site/assets
          printf '<meta http-equiv="refresh" content="0; url=slides/">' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
